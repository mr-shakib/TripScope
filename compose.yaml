name: tripscope

# Core data services start with `docker compose up -d`.
# Application containers (api, worker, web) and the one-off Spark runner use profiles:
#   docker compose --profile app up -d --build
#   docker compose --profile pipeline run --rm pipeline run --source yellow-2025-01
# All host ports bind to 127.0.0.1 only.

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 40
  start_period: 10s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tripscope}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      # Fixed name: infrastructure/clickhouse/users.d/tripscope-admin.xml grants it named-collection control.
      CLICKHOUSE_USER: tripscope_admin
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_WRITER_USER: ${CLICKHOUSE_WRITER_USER:-tripscope_writer}
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?set in .env}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-tripscope_reader}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set in .env}
      ANALYTICS_QUERY_TIMEOUT_SECONDS: ${ANALYTICS_QUERY_TIMEOUT_SECONDS:-30}
      TRIPSCOPE_LAKE_ENDPOINT: http://seaweedfs:8333/
      S3_CLICKHOUSE_ACCESS_KEY: ${S3_CLICKHOUSE_ACCESS_KEY:?set in .env}
      S3_CLICKHOUSE_SECRET_KEY: ${S3_CLICKHOUSE_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HOST_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.d/tripscope.xml:/etc/clickhouse-server/config.d/tripscope.xml:ro
      - ./infrastructure/clickhouse/users.d/tripscope-admin.xml:/etc/clickhouse-server/users.d/tripscope-admin.xml:ro
      - ./infrastructure/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/tripscope/entrypoint.sh"]
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024", "-ip.bind=0.0.0.0"]
    environment:
      S3_BUCKET: ${S3_BUCKET:-tripscope-lake}
      S3_TEST_BUCKET: ${S3_TEST_BUCKET:-tripscope-test}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
      S3_CLICKHOUSE_ACCESS_KEY: ${S3_CLICKHOUSE_ACCESS_KEY:?set in .env}
      S3_CLICKHOUSE_SECRET_KEY: ${S3_CLICKHOUSE_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"
    volumes:
      - seaweedfs-data:/data
      - ./infrastructure/seaweedfs/entrypoint.sh:/opt/tripscope/entrypoint.sh:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]

  # One-shot: creates the lake buckets through the SeaweedFS admin shell (not exposed to the host).
  storage-init:
    image: chrislusf/seaweedfs:4.48
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for b in "$${S3_BUCKET}" "$${S3_TEST_BUCKET}"; do
          if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 | grep -qw "$$b"; then
            echo "bucket $$b exists"
          else
            echo "s3.bucket.create -name $$b" | weed shell -master=seaweedfs:9333
            echo "bucket $$b created"
          fi
        done
    environment:
      S3_BUCKET: ${S3_BUCKET:-tripscope-lake}
      S3_TEST_BUCKET: ${S3_TEST_BUCKET:-tripscope-test}
    restart: "no"

  # ---- Application (profile: app) -------------------------------------------------------------
  # Each container gets only the credentials it needs: the API has the read-only ClickHouse user
  # and no lake or writer secrets; the pipeline has the writer and the lake read/write identity.
  db-migrate:
    profiles: ["app", "pipeline"]
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile, target: api }
    image: tripscope-api:dev
    command: ["alembic", "upgrade", "head"]
    environment: &postgres-env
      APP_ENV: ${APP_ENV:-development}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tripscope}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    profiles: ["app"]
    image: tripscope-api:dev  # built by db-migrate (same image)
    environment:
      <<: *postgres-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-tripscope}
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-tripscope_reader}
      ANALYTICS_QUERY_TIMEOUT_SECONDS: ${ANALYTICS_QUERY_TIMEOUT_SECONDS:-30}
      ANALYTICS_MAX_RANGE_DAYS: ${ANALYTICS_MAX_RANGE_DAYS:-1100}
      # Readiness checks the lake bucket; this identity is the app's, reachable only inside the network.
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-tripscope-lake}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      MANIFEST_PATH: /app/manifests/sources.yaml
    volumes:
      - ./manifests:/app/manifests:ro
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  web:
    profiles: ["app"]
    image: tripscope-web:dev
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        TRIPSCOPE_API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }

  # Processes jobs queued through the API (ADR-15). Finishes the current job on stop when it can.
  worker:
    profiles: ["app"]
    image: tripscope-pipeline:dev
    command: ["worker"]
    environment: &pipeline-env
      <<: *postgres-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-tripscope}
      CLICKHOUSE_WRITER_USER: ${CLICKHOUSE_WRITER_USER:-tripscope_writer}
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_BUCKET: ${S3_BUCKET:-tripscope-lake}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PIPELINE_WORK_DIR: /data/work
      PIPELINE_MAX_SOURCE_MB: ${PIPELINE_MAX_SOURCE_MB:-500}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-4g}
      MANIFEST_PATH: /app/manifests/sources.yaml
    volumes:
      - pipeline-work:/data/work
      - ./manifests:/app/manifests:ro
    stop_grace_period: 2m
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

  # One-off Spark runs: docker compose --profile pipeline run --rm pipeline run --source yellow-2025-01
  pipeline:
    profiles: ["pipeline"]
    image: tripscope-pipeline:dev
    build: { context: ., dockerfile: infrastructure/docker/backend.Dockerfile, target: pipeline }
    environment: *pipeline-env
    volumes:
      - pipeline-work:/data/work
      - ./manifests:/app/manifests:ro
    working_dir: /app
    depends_on:
      db-migrate: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }

volumes:
  postgres-data:
  clickhouse-data:
  seaweedfs-data:
  pipeline-work:
