[project]
name = "tripscope"
version = "0.1.0"
description = "TripScope: NYC TLC trip-data pipeline, analytics API and grounded AI analyst"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.20,<2",
    "argon2-cffi>=25.1,<26",
    "boto3>=1.43,<2",
    "clickhouse-connect>=1.10,<2",
    "fastapi>=0.143,<0.200",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.3,<4",
    "pyarrow>=26,<27",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "pyjwt>=2.15,<3",
    "pyyaml>=6.0,<7",
    "reportlab>=5.0,<6",
    "sqlalchemy>=2.1,<2.2",
    "uvicorn[standard]>=0.54,<0.60",
    "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
# Spark is only needed by the pipeline runner, not by the API image.
pipeline = ["pyspark==4.2.0", "pyshp>=3.1,<4", "pyproj>=3.8,<4", "shapely>=2.2,<3"]

[project.scripts]
tripscope-pipeline = "tripscope.pipeline.cli:main"
tripscope-admin = "tripscope.metadata.cli:main"
tripscope-report-worker = "tripscope.reports.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4,<3",
    "pytest>=9.1,<10",
    "ruff>=0.16,<0.17",
    "types-pyyaml>=6.0",
    "boto3-stubs[s3]>=1.43",
    "python-dotenv>=1.2.4",
    "pypdf>=6.19,<7",
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripscope"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "S101", "PLR0911", "PLC0415", "N812"]  # N812: pyspark F/T convention

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR0915", "S608", "PLR0917"]
"migrations/**" = ["E501"]
# Interpolates only validated identifiers/paths; values are bound parameters (see module docstring).
"src/tripscope/pipeline/clickhouse_load.py" = ["S608"]
"src/tripscope/analytics/query_builder.py" = ["S608"]
"src/tripscope/pipeline/aggregates.py" = ["S608"]
# Report text uses typographic punctuation on purpose (en dashes in ranges, a true minus sign, ×).
"src/tripscope/reports/**" = ["RUF001", "RUF002"]
"src/tripscope/ai/**" = ["RUF001", "RUF002"]
"tests/unit/test_reports.py" = ["RUF001"]
"tests/integration/test_reports.py" = ["RUF001"]
"tests/unit/test_ai.py" = ["RUF001"]
"tests/integration/test_ai.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["tripscope"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyspark.*", "clickhouse_connect.*", "pyarrow.*", "shapefile.*", "shapely.*", "pyproj.*", "reportlab.*", "xlsxwriter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Starlette's TestClient deprecation of httpx is upstream noise, not a TripScope issue.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "spark: runs a local SparkSession (slower, needs Java 17+)",
    "integration: needs the docker compose services (PostgreSQL, ClickHouse, SeaweedFS)",
]
